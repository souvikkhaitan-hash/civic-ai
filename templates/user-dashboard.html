<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard | AI Complaint Portal</title>

  <script>
    const token = localStorage.getItem("user_token");
    if (!token) {
      alert("Login required");
      window.location.href = "/user-login-ui";
    }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    :root {
      --primary: #0b3d91;
      --secondary: #1f5fbf;
      --accent: #c79a2b;
      --bg: #f1f4f8;
      --green: #2e7d32;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg);
    }

    header {
      background: var(--primary);
      color: white;
      padding: 15px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid var(--accent);
    }

    nav ul {
      display: flex;
      gap: 25px;
      list-style: none;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .dashboard {
      flex: 1;
      padding: 40px 80px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 30px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .add-btn {
      background: var(--green);
      color: white;
      padding: 12px 18px;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th {
      background: #eef2f7;
      padding: 14px;
      text-align: left;
    }

    td {
      padding: 14px;
      border-top: 1px solid #eee;
    }

    .status {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
    }

    .pending {
      background: #fff3cd;
      color: #856404;
    }

    .progress {
      background: #d1ecf1;
      color: #0c5460;
    }

    .resolved {
      background: #d4edda;
      color: #155724;
    }

    footer {
      background: #081f4b;
      color: white;
      text-align: center;
      padding: 15px;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 400px;
    }

    .modal textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    .modal-actions {
      margin-top: 10px;
      text-align: right;
    }
  </style>
</head>

<body>

  <header>
    <div>Advanced Complaint Management Portal</div>
    <nav>
      <ul>
        <li><a href="/user-dashboard">Dashboard</a></li>
        <li><a href="#" onclick="logoutUser()">Logout</a></li>
      </ul>
    </nav>
  </header>

  <section class="dashboard">
    <h1>Citizen Dashboard</h1>
    <p class="subtitle">Manage and track your complaints</p>

    <div class="actions">
      <h3>Recent Complaints</h3>
      <button class="add-btn" onclick="openModal()">+ Add Complaint</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Complaint</th>
          <th>Department</th>
          <th>Status</th>
          <th>Proof</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="complaint-table">
        <tr>
          <td colspan="7">Loading...</td>
        </tr>
      </tbody>
    </table>
  </section>

  <footer>© 2026 AI Complaint Management System</footer>

  <!-- MODAL -->
  <div id="complaintModal" class="modal">
    <div class="modal-box">
      <h3>Submit Complaint</h3>
      
      <div style="margin-top: 15px;">
        <select id="stateSelect" style="width: 100%; padding: 10px; margin-bottom: 10px;" onchange="updateCities()">
          <option value="">Select State *</option>
          <option value="Karnataka">Karnataka</option>
          <option value="West Bengal">West Bengal</option>
        </select>

        <select id="citySelect" style="width: 100%; padding: 10px; margin-bottom: 10px;" onchange="updateAreas()">
          <option value="">Select City *</option>
        </select>

        <select id="areaSelect" style="width: 100%; padding: 10px; margin-bottom: 10px;">
          <option value="">Select Area *</option>
        </select>

        <input type="hidden" id="latitude">
        <input type="hidden" id="longitude">
      </div>

      <input id="manualLocation" type="text" placeholder="Landmark / Street (optional)"
        style="width:100%;padding:10px;margin-bottom:10px;">
      
      <input id="mobileNumber" type="tel" placeholder="Mobile Number for Updates (10 digits) *" 
        style="width:100%;padding:10px;margin-bottom:10px;" required>

      <textarea id="complaintText" rows="4" placeholder="Describe your issue..."></textarea>
      
      <div style="margin-top:10px;">
        <label style="font-size:12px;color:#666;">Attach Image (JPG, PNG, JPEG - Max 5MB):</label>
        <input id="complaintImage" type="file" accept="image/*" style="width:100%;margin-top:5px;">
      </div>

      <div class="modal-actions">
        <button id="submitBtn" onclick="submitComplaint()" style="background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Submit Complaint</button>
        <button onclick="closeModal()" style="padding: 10px 20px; border: none; cursor: pointer;">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const locationData = {
      "Karnataka": {
        "cities": {
          "Bengaluru": ["Rajanukunte", "Whitefield", "Indiranagar", "Electronic City", "Koramangala"],
          "Mysuru": ["Hebbal", "Vijayanagar"]
        }
      },
      "West Bengal": {
        "cities": {
          "Kolkata": ["Kolkata", "New Town", "Salt Lake", "Behala", "Dum Dum"],
          "Howrah": ["Howrah Maidam", "Shibpur"]
        }
      }
    };

    function updateCities() {
      const state = document.getElementById("stateSelect").value;
      const citySelect = document.getElementById("citySelect");
      const areaSelect = document.getElementById("areaSelect");
      
      citySelect.innerHTML = '<option value="">Select City *</option>';
      areaSelect.innerHTML = '<option value="">Select Area *</option>';
      
      if (state && locationData[state]) {
        Object.keys(locationData[state].cities).forEach(city => {
          const opt = document.createElement("option");
          opt.value = city;
          opt.textContent = city;
          citySelect.appendChild(opt);
        });
      }
    }

    function updateAreas() {
      const state = document.getElementById("stateSelect").value;
      const city = document.getElementById("citySelect").value;
      const areaSelect = document.getElementById("areaSelect");
      
      areaSelect.innerHTML = '<option value="">Select Area *</option>';
      
      if (state && city && locationData[state].cities[city]) {
        locationData[state].cities[city].forEach(area => {
          const opt = document.createElement("option");
          opt.value = area;
          opt.textContent = area;
          areaSelect.appendChild(opt);
        });
      }
    }

    // ================= LOAD COMPLAINTS =================
    async function loadUserComplaints() {
      const res = await fetch("/user/complaints", {
        headers: { Authorization: "Bearer " + token }
      });

      if (res.status === 401) {
        localStorage.removeItem("user_token");
        alert("Session expired");
        window.location.href = "/user-login-ui";
        return;
      }

      const data = await res.json();
      const table = document.getElementById("complaint-table");
      table.innerHTML = "";

      if (!data.length) {
        table.innerHTML = "<tr><td colspan='7'>No complaints yet</td></tr>";
        return;
      }

      data.forEach(c => {
        let cls = "pending";
        if (c.status === "IN_PROGRESS") cls = "progress";
        if (c.status === "RESOLVED") cls = "resolved";

        table.innerHTML += `
<tr>
  <td>#${c.id}</td>
  <td>${c.complaint}</td>
  <td>${c.department}</td>
  <td><span class="status ${cls}">${c.status}</span></td>
  <td>${c.image_path ? `<a href="/static/${c.image_path}" target="_blank">View</a>` : "No proof"}</td>
  <td>${c.created_at}</td>
  <td>
    ${c.status === "OPEN" ? `<button onclick="deleteComplaint(${c.id})">Delete</button>` : ""}
  </td>
</tr>`;
      });
    }

    // ================= MODAL =================
    function openModal() { document.getElementById("complaintModal").style.display = "flex"; }
    function closeModal() { document.getElementById("complaintModal").style.display = "none"; }

    // ================= SUBMIT (HARDENED GPS ENGINE) =================
    window.submitComplaint = function() {
      const text = document.getElementById("complaintText").value;
      const state = document.getElementById("stateSelect").value;
      const city = document.getElementById("citySelect").value;
      const area = document.getElementById("areaSelect").value;
      const mobile = document.getElementById("mobileNumber").value;
      const imageFile = document.getElementById("complaintImage").files[0];
      const submitBtn = document.getElementById("submitBtn");

      if (!text) return alert("Please enter complaint details");

      // UI INDICATOR
      submitBtn.disabled = true;
      submitBtn.innerText = "📍 SECURING GPS...";

      if (!navigator.geolocation) {
        sendFinal(text, null, null);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          console.log("[GPS] SECURED:", lat, lng);
          sendFinal(text, lat, lng);
        },
        function(err) {
          console.warn("[GPS] FAILED/DENIED:", err.message);
          sendFinal(text, null, null);
        },
        { timeout: 8000 }
      );

      function sendFinal(complaintText, lat, lng) {
        // We use FormData for high-fidelity support (including images)
        const fd = new FormData();
        fd.append("complaint", complaintText);
        fd.append("state", state);
        fd.append("city", city);
        fd.append("area", area);
        fd.append("mobile", mobile);

        if (lat && lng) {
          fd.append("latitude", lat);
          fd.append("longitude", lng);
          fd.append("location_source", "GPS");
        } else {
          fd.append("location_source", "USER_SELECTED");
        }

        if (imageFile) fd.append("image", imageFile);

        console.log("[SYS] DISPATCHING REPORT...");

        fetch("/submit-complaint", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + token
          },
          body: fd
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert("Complaint Logged Successfully!");
            location.reload();
          } else {
            alert("Submission Refused: " + (data.error || "Unknown"));
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Complaint";
          }
        })
        .catch(err => {
          console.error("Critical Network Error:", err);
          alert("Network unstable. Please retry.");
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit Complaint";
        });
      }
    }

    async function deleteComplaint(id) {
      if (!confirm("Delete this complaint?")) return;

      const res = await fetch(`/user/delete/${id}`, {
        method: "DELETE",
        headers: {
          Authorization: "Bearer " + token
        }
      });

      const result = await res.json();

      if (result.success) {
        alert("Deleted successfully");
        loadUserComplaints();
      } else {
        alert(result.error || "Delete failed");
      }
    }

    // ================= LOGOUT =================
    function logoutUser() {
      localStorage.removeItem("user_token");
      window.location.href = "/user-login-ui";
    }

    // AUTO LOAD
    loadUserComplaints();
    setInterval(loadUserComplaints, 10000);

    // Modular Notifications Init
    if (window.initNotifs) window.initNotifs(token);
  </script>

</body>

</html>
