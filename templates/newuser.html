<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citizen Registration | AI Complaint Portal</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI", Arial, sans-serif;
}

:root{
--primary:#0b3d91;
--secondary:#1f5fbf;
--accent:#c79a2b;
--bg:#f1f4f8;
--text:#333;
--green:#2e7d32;
}

body{
display:flex;
flex-direction:column;
min-height:100vh;
background:var(--bg);
}

/* HEADER */

header{
background:var(--primary);
color:white;
padding:15px 60px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:4px solid var(--accent);
}

.logo{
font-size:22px;
font-weight:600;
}

nav ul{
display:flex;
list-style:none;
gap:25px;
}

/* REGISTER SECTION */

.register-section{
flex:1;
display:flex;
align-items:center;
justify-content:center;
padding:60px 20px;
}

.register-card{
background:white;
width:500px;
padding:40px;
border-radius:8px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
border-top:5px solid var(--primary);
}

.register-card h2{
text-align:center;
color:var(--primary);
margin-bottom:25px;
}

/* FORM */

.form-group{
margin-bottom:16px;
}

label{
display:block;
margin-bottom:6px;
font-weight:600;
color:#444;
}

.password-container {
  position: relative;
}

.toggle-password {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color: #888;
  opacity: 0.7;
  display: flex;
  align-items: center;
  user-select: none;
}

.toggle-password:hover {
  opacity: 1;
}

input, select{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:4px;
font-size:15px;
}

input:focus{
outline:none;
border-color:var(--secondary);
}

/* BUTTON */

.register-btn{
width:100%;
padding:12px;
background:var(--green);
color:white;
border:none;
border-radius:4px;
font-size:16px;
cursor:pointer;
margin-top:10px;
font-weight:600;
}

.register-btn:hover{
background:#1f5e25;
}

.extra{
text-align:center;
margin-top:15px;
font-size:14px;
}

.extra a{
color:var(--secondary);
text-decoration:none;
}

/* FOOTER */

footer{
background:#081f4b;
color:white;
text-align:center;
padding:18px;
margin-top:auto;
font-size:14px;
}
nav ul{
display:flex;
list-style:none;
gap:25px;
}

nav a{
text-decoration:none;
color:white;
font-size:15px;
font-weight:500;
}

nav a:hover{
text-decoration:underline;
}
</style>
</head>
<body>

<header>
<div class="logo">Advanced Complaint Management Portal</div>

<nav>
<ul class="nav-links">
<li><a href="/">Home</a></li>
<li><a href="/user-dashboard">Dashboard</a></li>
<li><a href="/user-login-ui">User Login</a></li>
<li><a href="/officer-login">Officer Login</a></li>
<li><a href="/admin-login">Admin Login</a></li>
<li><a href="/register-ui">Register</a></li>
</ul>
</nav>
</header>


<section class="register-section">

<div class="register-card">

<h2>Citizen Registration</h2>

<form onsubmit="registerUser(event)">

<div class="form-group">
<label>Full Name</label>
<input id="name" type="text" required placeholder="Enter your full name">
</div>

<div class="form-group">
<label>Email Address</label>
<input id="email" type="email" required placeholder="Enter your email">
</div>

<div class="form-group">
<label>Create Password</label>
<div class="password-container">
  <input id="password" type="password" required placeholder="Create password" style="padding-right: 40px;">
  <span class="toggle-password" onclick="togglePassword('password', this)">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
  </span>
</div>
</div>

<button class="register-btn">Create Account</button>

<div class="extra">
<p>Already registered? <a href="/user-login-ui">Login here</a></p>
</div>

</form>

</div>

</section>


</footer>
<script>
function togglePassword(inputId, icon) {
  const input = document.getElementById(inputId);
  if (input.type === "password") {
    input.type = "text";
    icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94a10.07 10.07 0 0 1-12.88 0M1 12s4-8 11-8a11.78 11.78 0 0 1 7.4 2.6M21 12s-4 8-11 8a11.78 11.78 0 0 1-7.4-2.6L1 1m22 22L1 1"></path></svg>';
  } else {
    input.type = "password";
    icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
  }
}
async function registerUser(e) {
  e.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    const res = await fetch("/auth/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ name, email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      alert(data.error || "Registration failed");
      return;
    }

    alert("Registration successful! Please login.");
    window.location.href = "/user-login-ui";

  } catch (err) {
    alert("Server error");
    console.error(err);
  }
}
</script>
</body>
</html>
