<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Complaint Admin Dashboard</title>

  <!-- Flask static CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>

<body>

<header class="header">
  <div class="header-title">
    🛡️ Complaint Admin
  </div>
  <button onclick="doLogout()">🚪 Logout</button>
</header>

<div class="main">

  <!-- STATS -->
  <div class="stats-grid">
    <div>Total: <span id="total-count">0</span></div>
    <div>Open: <span id="open-count">0</span></div>
    <div>In Progress: <span id="progress-count">0</span></div>
    <div>Resolved: <span id="resolved-count">0</span></div>
  </div>

  <!-- SEARCH -->
  <input placeholder="Search..." oninput="filterTable(this.value)">

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Complaint</th>
        <th>Department</th>
        <th>Priority</th>
        <th>Status</th>
        <th>Risk</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>

</div>

<!-- Flask static JS -->
<script src="{{ url_for('static', filename='admin.js') }}"></script>

</body>
</html>
