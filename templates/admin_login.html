<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - Civic AI Command Center</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0b3d91;
      --primary-hover: #082d6b;
      --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
      --text-main: #111827;
      --text-muted: #6b7280;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 40px;
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
    }

    /* Government Tag */
    .govt-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f3f4f6;
      padding: 6px 12px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .login-logo {
      font-size: 32px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .portal-subtitle {
      font-size: 14px;
      font-weight: 500;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .description {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 32px;
      padding: 0 10px;
    }

    form {
      text-align: left;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .input-container {
      position: relative;
    }

    .input-container input {
      width: 100%;
      padding: 12px 14px;
      padding-left: 40px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s;
      outline: none;
    }

    .input-container input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(11, 61, 145, 0.1);
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }

    .password-container {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--text-muted);
      opacity: 0.7;
      display: flex;
      align-items: center;
      transition: opacity 0.2s;
    }

    .toggle-password:hover {
      opacity: 1;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(to right, var(--primary), var(--primary-hover));
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      opacity: 0.95;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Mobile Responsive */
    @media (max-width: 480px) {
      .login-card {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="govt-tag">
      <span>🇮🇳</span> Digital Gram Panchayat System
    </div>

    <h1>Civic AI Command Center</h1>
    <div class="portal-subtitle">Gram Panchayat Administration Portal</div>

    <p class="description">
      Secure login for authorized administrative officers to manage civic complaints and monitor rural issues.
    </p>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-container">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </span>
          <input type="text" id="username" placeholder="Enter Admin ID" required autocomplete="username" />
        </div>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <label for="password">Password</label>
        </div>
        <div class="input-container password-container">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
          <input type="password" id="password" placeholder="Enter Password" required autocomplete="current-password" />
          <span class="toggle-password" onclick="togglePassword('password', this)">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </span>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="login-btn">Sign In to Dashboard</button>
    </form>

    <div class="footer">
      AI-powered complaint monitoring system for rural governance
    </div>
  </div>
</div>

<script>
function togglePassword(inputId, icon) {
  const input = document.getElementById(inputId);
  const eyeIcon = icon.querySelector('.eye-icon');
  if (input.type === "password") {
    input.type = "text";
    eyeIcon.innerHTML = '<path d="M17.94 17.94a10.07 10.07 0 0 1-12.88 0M1 12s4-8 11-8a11.78 11.78 0 0 1 7.4 2.6M21 12s-4 8-11 8a11.78 11.78 0 0 1-7.4-2.6L1 1m22 22L1 1"></path>';
  } else {
    input.type = "password";
    eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
  }
}

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const btn = document.getElementById("login-btn");
  const originalText = btn.textContent;
  btn.textContent = "Signing in...";
  btn.disabled = true;

  try {
    const usernameVal = document.getElementById("username").value;
    const passwordVal = document.getElementById("password").value;

    const res = await fetch("/admin-login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        username: usernameVal,
        password: passwordVal
      })
    });

    const data = await res.json();

    if (!res.ok) {
      alert(data.error || "Login failed");
      return;
    }

    // ✅ SESSION LOGIN SUCCESS
    window.location.href = "/admin/select-location";

  } catch (err) {
    alert("Network error. Please try again.");
    console.error(err);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
});
</script>

</body>
</html>
