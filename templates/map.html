<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Civic AI Dashboard</title> <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: white;
    }

    .header {
      padding: 16px 24px;
      background: linear-gradient(90deg, #0ea5e9, #6366f1);
      font-weight: bold;
      font-size: 20px;
      letter-spacing: 0.5px;
    }

    .grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 60px);
    }

    .sidebar {
      background: #020617;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid #1e293b;
    }

    .card {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      transition: 0.2s ease;
    }

    .card:hover {
      background: #0f172a;
      transform: translateY(-2px);
      cursor: pointer;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
      margin-top: 6px;
    }

    .low {
      background: #16a34a;
    }

    .medium {
      background: #f59e0b;
    }

    .high {
      background: #ef4444;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .topbar {
      position: absolute;
      top: 80px;
      right: 20px;
      background: rgba(2, 6, 23, 0.8);
      padding: 14px 16px;
      border-radius: 12px;
      backdrop-filter: blur(12px);
      font-size: 13px;
      border: 1px solid #1e293b;
    }

    .legend {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.8;
    }

    .weather-card {
      background: #111827;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      color: white;
      font-size: 14px;
    }

    .weather-card h3 {
      margin-bottom: 6px;
      color: #60a5fa;
    }
  </style>
</head>

<body>
  <div class="header">🚀 Civic AI Smart Dashboard</div>
  <div class="grid">
    <div class="sidebar" id="complaintsList">
      <div class="weather-card">
        <h3>🌤 Weather AI</h3>
        <div id="weatherBox">Loading...</div>
      </div>
    </div>
    <div id="map"></div>
  </div>
  <div class="topbar">
    <div>🧠 AI Risk Intelligence</div>
    <div class="legend">Red = High | Yellow = Medium | Green = Low</div>
  </div>
  <script>
    const map = L.map('map').setView([22.5726, 88.3639], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const complaintsList = document.getElementById('complaintsList');

    const priorityColor = (p) => {
      if (p === 'HIGH') return 'red';
      if (p === 'MEDIUM') return 'orange';
      return 'green';
    };

    function badgeClass(priority) {
      if (priority === 'HIGH') return 'badge high';
      if (priority === 'MEDIUM') return 'badge medium';
      return 'badge low';
    }

    async function loadComplaints() {
      const res = await fetch('/admin/complaints');
      const data = await res.json();

      data.forEach(c => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div><b>${c.complaint}</b></div>
          <div class="badge ${c.priority.toLowerCase()}">${c.priority}</div>
          <div style="font-size:12px;margin-top:6px;opacity:0.7">
            Dept: ${c.department}<br>
            Risk Score: ${c.risk_score}
          </div>
        `;

        complaintsList.appendChild(card);

        if (c.latitude && c.longitude) {
          const marker = L.circleMarker([c.latitude, c.longitude], {
            radius: 10,
            color: priorityColor(c.priority),
            fillOpacity: 0.6
          }).addTo(map);

          marker.bindPopup(`
            <b>${c.complaint}</b><br>
            Priority: ${c.priority}<br>
            Department: ${c.department}
          `);

          card.onclick = () => {
            map.setView([c.latitude, c.longitude], 15);
            marker.openPopup();
          };
        }
      });
    }

    loadComplaints();


    async function loadWeather() {
      const res = await fetch("/api/weather");
      const data = await res.json();

      document.getElementById("weatherBox").innerHTML = `
    🌡 Temp: ${data.temperature}°C<br>
    ☁ Condition: ${data.condition}<br>
    ⚠ Risk: <b>${data.risk_level}</b>
  `;
    }

    loadWeather();
  </script>
</body>

</html>
