<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Civic AI Dashboard</title> <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: white;
    }

    .header {
      padding: 16px 24px;
      background: linear-gradient(90deg, #0ea5e9, #6366f1);
      font-weight: bold;
      font-size: 20px;
      letter-spacing: 0.5px;
    }

    .grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 60px);
    }

    .sidebar {
      background: #020617;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid #1e293b;
    }

    .card {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      transition: 0.2s ease;
    }

    .card:hover {
      background: #0f172a;
      transform: translateY(-2px);
      cursor: pointer;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
      margin-top: 6px;
    }

    .low {
      background: #16a34a;
    }

    .medium {
      background: #f59e0b;
    }

    .high {
      background: #ef4444;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .topbar {
      position: absolute;
      top: 80px;
      right: 20px;
      background: rgba(2, 6, 23, 0.8);
      padding: 14px 16px;
      border-radius: 12px;
      backdrop-filter: blur(12px);
      font-size: 13px;
      border: 1px solid #1e293b;
    }

    .legend {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.8;
    }

    .weather-card {
      background: #111827;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      color: white;
      font-size: 14px;
    }

    .weather-card h3 {
      margin-bottom: 6px;
      color: #60a5fa;
    }
  </style>
</head>

<body>
  <div class="header">🚀 Civic AI Smart Dashboard</div>
  <div class="grid">
    <div class="sidebar" id="complaintsList">
      <div class="weather-card">
        <h3>🌤 Weather AI</h3>
        <div id="weatherBox">Loading...</div>
      </div>
    </div>
    <div id="map"></div>
  </div>
  <div class="topbar">
    <div>🧠 AI Risk Intelligence</div>
    <div class="legend">Red = High | Yellow = Medium | Green = Low</div>
  </div>
  <script>
    // INJECTIVE CONFIG
    const __region = JSON.parse('{{ region | tojson | safe }}');
    const __center = JSON.parse('{{ center | tojson | safe }}');

    window.ADMIN_CONFIG = {
      region: __region,
      center: __center
    };

    console.log("CENTER FROM BACKEND:", __center);

    const config = window.ADMIN_CONFIG || {};

    // 1. FORCE MAP CENTER
    let centerCoords = [12.9716, 77.5946];
    let zoomLevel = 12;

    if (__center && __center.length === 2) {
      centerCoords = __center;
      zoomLevel = 15;
    }

    const map = L.map('map');
    map.setView(centerCoords, zoomLevel);

    map.on('click', function (e) {
      checkTraffic(e.latlng.lat, e.latlng.lng);
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const complaintsList = document.getElementById('complaintsList');

    const priorityColor = (p) => {
      if (p === 'HIGH') return 'red';
      if (p === 'MEDIUM') return 'orange';
      return 'green';
    };

    function badgeClass(priority) {
      if (priority === 'HIGH') return 'badge high';
      if (priority === 'MEDIUM') return 'badge medium';
      return 'badge low';
    }

    let trafficPoints = [];
    let complaintsData = [];
    let trafficLayer = L.layerGroup().addTo(map);

    async function loadComplaints() {
      const state = __region ? __region.state : null;
      const city = __region ? __region.city : null;
      const area = __region ? __region.area : null;

      const res = await fetch(`/admin/complaints?state=${state || ''}&city=${city || ''}&area=${area || ''}`);
      const data = await res.json();
      complaintsData = data;

      data.forEach(c => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div><b>${c.complaint}</b></div>
          <div class="badge ${c.priority.toLowerCase()}">${c.priority}</div>
          <div style="font-size:12px;margin-top:6px;opacity:0.7">
            ${c.location_source === "GPS" ? "Live Location" : (c.address || "Unknown")}<br>
            Dept: ${c.department}<br>
            Risk Score: ${c.risk_score}
          </div>
        `;

        complaintsList.appendChild(card);

        if (c.latitude != null && c.longitude != null) {
          const marker = L.circleMarker([c.latitude, c.longitude], {
            radius: 10,
            color: priorityColor(c.priority),
            fillOpacity: 0.6
          }).addTo(map);

          marker.bindPopup(`
    <b>${c.complaint}</b><br>
    Priority: ${c.priority}<br>
    ${c.location_source === "GPS" ? "Live Location" : (c.address || "Unknown")}<br>
    Department: ${c.department}
  `);

          card.onclick = () => {
            map.setView([c.latitude, c.longitude], 15);
            marker.openPopup();
          };
        }
      });

      detectHighRiskZones();
    }

    loadComplaints();

    async function loadWeather() {
      const res = await fetch("/api/weather");
      const data = await res.json();

      document.getElementById("weatherBox").innerHTML = `
    🌡 Temp: ${data.temperature}°C<br>
    ☁ Condition: ${data.condition}<br>
    ⚠ Risk: <b>${data.risk_level}</b>
  `;
    }

    loadWeather();

    function loadAreaTraffic() {
      // USE REGION CENTER
      const center = {
        lat: centerCoords[0],
        lng: centerCoords[1]
      };

      // IMPROVE TRAFFIC GRID
      const step = 0.01;
      const points = [];

      // 9-point Grid for better coverage
      for (let i = -1; i <= 1; i++) {
        for (let j = -1; j <= 1; j++) {
          points.push([center.lat + (i * step), center.lng + (j * step)]);
        }
      }

      trafficPoints = [];
      trafficLayer.clearLayers();

      points.forEach(([lat, lng]) => {
        fetch(`/api/traffic?lat=${lat}&lon=${lng}`)
          .then(res => res.json())
          .then(data => {
            // ADD DEBUG FOR TRAFFIC API
            console.log("Traffic Data:", data);

            trafficPoints.push({ lat, lng, congestion: data.congestion });

            let color = "green";
            if (data.congestion === "HIGH") color = "red";
            else if (data.congestion === "MEDIUM") color = "orange";

            // Draw Polyline for visual road flow
            if (data.coordinates && Array.isArray(data.coordinates) && data.coordinates.length > 1) {
              L.polyline(data.coordinates, {
                color: color,
                weight: 8,
                opacity: 1
              }).addTo(trafficLayer)
                .bindPopup(`<b>Traffic:</b> ${data.congestion}<br>Speed: ${data.speed}`);
            } else {
              L.circleMarker([lat, lng], {
                radius: 6,
                color: color,
                fillOpacity: 0.7
              }).addTo(trafficLayer)
                .bindPopup(`<b>Traffic:</b> ${data.congestion}<br>Speed: ${data.speed}`);
            }

            detectHighRiskZones();
          })
          .catch(err => console.log("Traffic error:", err));
      });
    }

    function detectHighRiskZones() {
      if (!complaintsData.length || !trafficPoints.length) return;

      complaintsData.forEach(c => {
        trafficPoints.forEach(t => {
          const distance = Math.sqrt(
            Math.pow(c.latitude - t.lat, 2) +
            Math.pow(c.longitude - t.lng, 2)
          );

          if (distance < 0.003 && t.congestion === "HIGH") {
            L.circle([c.latitude, c.longitude], {
              radius: 80,
              color: "red",
              fillOpacity: 0.3,
              weight: 2
            }).addTo(map)
              .bindPopup("🚨 <b>HIGH RISK ZONE</b><br>Detected: High Traffic + Civic Issue");
          }
        });
      });
    }

    // FIX TRAFFIC LOAD TIMING
    setTimeout(() => {
      loadAreaTraffic();
    }, 1000);

    // ADD AUTO REFRESH ON MAP MOVE
    map.on('moveend', () => {
      loadAreaTraffic();
    });

    // Refresh every 30 seconds
    setInterval(loadAreaTraffic, 30000);

    function checkTraffic(lat, lng) {
      fetch(`/api/traffic?lat=${lat}&lon=${lng}`)
        .then(res => res.json())
        .then(data => {
          console.log("Point Traffic:", data);
        });
    }
  </script>
</body>

</html>
