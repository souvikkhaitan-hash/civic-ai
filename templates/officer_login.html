<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Officer Login - Civic AI Command Center</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0b3d91;
      --primary-hover: #082d6b;
      --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #dbeafe 100%);
      --text-main: #111827;
      --text-muted: #6b7280;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text-main);
    }

    /* Top Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 60px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
    }

    .nav-brand {
      font-weight: 700;
      font-size: 18px;
      color: var(--primary);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    .nav-links li a {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links li a:hover {
      color: var(--text-main);
    }

    /* Login Area */
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 380px;
      padding: 40px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      background: #eef2ff;
      border-radius: 10px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }

    h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .forgot-link {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-main);
      transition: all 0.2s;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(11, 61, 145, 0.1);
    }

    .error-msg {
      color: #dc2626;
      font-size: 13px;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .btn-login {
      width: 100%;
      height: 48px;
      background: linear-gradient(to right, var(--primary), var(--primary-hover));
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    .btn-login:hover {
      opacity: 0.95;
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .footer-note {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f3f4f6;
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Mobile */
    @media (max-width: 600px) {
      .navbar {
        padding: 20px;
      }
      .nav-links {
        display: none;
      }
      .login-card {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="nav-brand">Civic AI Command Center</a>
    <ul class="nav-links">
      <li><a href="#">Accessibility</a></li>
      <li><a href="#">Support</a></li>
      <li><a href="#">Transparency</a></li>
    </ul>
    <div style="width: 24px; height: 18px; border-top: 2px solid #000; border-bottom: 2px solid #000; display: none;"></div>
  </nav>

  <div class="login-container">
    <div class="login-card">
      <div class="icon-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>

      <h2>Officer Login</h2>
      <p class="subtitle">Secure access for authorized civic personnel only.</p>

      {% if error %}
        <div class="error-msg">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/officer-login">
        <div class="form-group">
          <div class="form-header">
            <label for="email">Email Address</label>
          </div>
          <input type="email" id="email" name="email" placeholder="officer@agency.gov" required autocomplete="email" />
        </div>

        <div class="form-group">
          <div class="form-header">
            <label for="password">Password</label>
            <a href="#" class="forgot-link">Forgot?</a>
          </div>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn-login">Login &rarr;</button>
      </form>

      <div class="footer-note">
        <span style="font-size: 14px;">●</span> MFA not required for demo access
      </div>
    </div>
  </div>

</body>
</html>
